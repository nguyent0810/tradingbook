# VNINDEX daily bars: fetch (Python/vnstock) + import to Postgres. Does not run on Vercel.
# JSON is written only to the runner temp dir — never to repo `data/`.

name: VNINDEX daily import

on:
  schedule:
    - cron: "30 11 * * 1-5" # Mon–Fri 11:30 UTC = 18:30 ICT (UTC+7)
  workflow_dispatch:

concurrency:
  group: vnindex-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Ephemeral path (not under repo `data/`); runner temp only exists per job
      VNINDEX_JSON: ${{ runner.temp }}/vnindex.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Fetch VNINDEX JSON (ephemeral)
        run: python scripts/fetch_vnindex.py --output "$VNINDEX_JSON"

      - name: Import into Postgres
        run: npx tsx scripts/import-bars.ts "$VNINDEX_JSON"
        # import-bars logs to stderr: Imported, Skipped, Date range, Latest close (see summary block)
