# Prospective shadow registry: record one settled session per trading day.
#
# Why a separate workflow instead of a step in production-bar-import.yml:
# PROSPECTIVE-REGISTRY-PLAN.md §6 requires that a registry failure can never fail
# the import or the scan. A workflow_run trigger keeps the two isolated while
# still starting the moment bars for session T have landed and before T+1 exists,
# which is the only window the late-run guard (§7) accepts.
#
# Storage: the registry is append-only NDJSON with a hash chain. It lives on the
# `prospective-registry` branch, not main, so each day's commit is timestamped
# evidence of what was recorded before its outcome existed, and so a daily commit
# does not redeploy production (vercel.json disables deploys for that branch).
#
# A failed run shows red and GitHub emails the owner. A missed session cannot be
# recorded later: the guard refuses, and §6 forbids fabricating it.

name: Prospective recorder

on:
  workflow_run:
    workflows: ["Production bar import"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: prospective-recorder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    # Only after a successful import: a failed import means session T is not
    # settled in the database, and the recorder would refuse anyway.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # REGISTRY_DIR is set in the first step: the `runner` context is not
      # available in job-level env, so referencing it there invalidates the file.

    steps:
      - name: Set registry path
        run: echo "REGISTRY_DIR=${RUNNER_TEMP}/registry" >> "$GITHUB_ENV"

      - name: Checkout main (code whose classifier blobs are verified)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate required secrets
        run: test -n "$DATABASE_URL" || (echo "Missing secret DATABASE_URL" && exit 1)

      - name: Check out registry branch as a separate worktree
        run: |
          set -euo pipefail
          # Explicit refspec: actions/checkout fetches only main, so a bare
          # `git fetch origin <branch>` is not guaranteed to create the
          # remote-tracking ref the next line needs.
          git fetch origin prospective-registry:refs/remotes/origin/prospective-registry
          git worktree add "$REGISTRY_DIR" origin/prospective-registry
          cd "$REGISTRY_DIR"
          git switch -C prospective-registry

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # Outcomes first: they only read bars strictly after each earlier decision.
      - name: Append outcomes for earlier decisions
        run: npx tsx scripts/replay/append-prospective-outcomes.ts --dir "$REGISTRY_DIR"

      # The recorder's own guard (src/lib/prospective/recorder.ts) only compares
      # against the DATABASE: it refuses T if bars after T exist there. If the DB
      # lags reality (a failed import, a late manual dispatch), T+1 may already
      # have traded while the DB still ends at T, and T would be recorded late.
      # This step closes that gap by wall clock, without touching the frozen code:
      # S is the latest weekday whose 15:00 ICT close has passed, and the run is
      # refused unless the next weekday's 09:00 ICT open is still in the future.
      # The recorder is then pinned to S, so its guard also requires the DB to
      # hold S and nothing after it. A weekday holiday makes S a day with no bars:
      # the recorder refuses (STALE_INPUT_BARS), which fails safe.
      - name: Resolve session by wall clock (Asia/Ho_Chi_Minh)
        id: wallclock
        run: |
          set -euo pipefail
          export TZ=Asia/Ho_Chi_Minh
          now=$(date +%s)
          d=$(date +%F)
          # Walk back to the latest weekday whose 15:00 close is <= now.
          while :; do
            dow=$(date -d "$d" +%u)
            close=$(date -d "$d 15:00" +%s)
            if [ "$dow" -le 5 ] && [ "$close" -le "$now" ]; then break; fi
            d=$(date -d "$d -1 day" +%F)
          done
          # Next weekday after S, at 09:00.
          n=$(date -d "$d +1 day" +%F)
          while [ "$(date -d "$n" +%u)" -gt 5 ]; do n=$(date -d "$n +1 day" +%F); done
          open=$(date -d "$n 09:00" +%s)
          if [ "$open" -le "$now" ]; then
            echo "REFUSED: session after $d ($n) has already opened; recording $d now would be late." >&2
            exit 3
          fi
          echo "session=$d" >> "$GITHUB_OUTPUT"
          echo "Recording session $d (next open $n 09:00 ICT)"

      - name: Record the settled session
        run: npx tsx scripts/replay/record-prospective-session.ts --session "${{ steps.wallclock.outputs.session }}" --out "$REGISTRY_DIR"

      - name: Commit and push registry
        run: |
          set -euo pipefail
          cd "$REGISTRY_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The branch's .gitignore excludes .registry.lock.
          git add -A
          if git diff --cached --quiet; then
            echo "Registry unchanged."
            exit 0
          fi
          git commit -m "registry: record session (run ${{ github.run_id }}, main ${{ github.sha }})"
          git push origin prospective-registry
