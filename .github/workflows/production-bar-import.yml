# Production bar import: VNINDEX + active equities (vnstock) → Neon, then daily scan.
# Does not run on Vercel (Python + ~15–25 min equity fetch exceeds serverless limits).
# Replaces the VNINDEX-only workflow; see docs/integration/PRODUCTION_BAR_IMPORT_AUTOMATION.md
#
# Equity fetch: by default fetches only stale/missing active symbols (Batch D).
# Rollback to full universe: set job env STALE_ONLY_FETCH=0 (or workflow_dispatch input).

name: Production bar import

on:
  schedule:
    # Mon–Fri 12:30 UTC (~19:30 ICT) — after VN cash session; before Vercel backup scan
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      trigger_scan:
        description: "Call /api/cron/daily-scan after successful import"
        type: boolean
        default: true
      skip_equity:
        description: "VNINDEX import only (skip equity fetch/import)"
        type: boolean
        default: false
      stale_only_fetch:
        description: "Fetch stale/missing active symbols only (set false for full universe)"
        type: boolean
        default: true

concurrency:
  group: production-bar-import
  cancel-in-progress: false

jobs:
  import-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BAR_IMPORT_REQUIRE_PRODUCTION_DB: "1"
      PROD_DB_HOST_ALLOWLIST: neon.tech
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DEPLOYMENT_URL: ${{ secrets.DEPLOYMENT_URL }}
      TRIGGER_SCAN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_scan == 'false' && '0' || '1' }}
      SKIP_EQUITY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_equity == 'true' && '1' || '0' }}
      # Default 1 = stale-only when dispatch input not set (scheduled runs).
      STALE_ONLY_FETCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stale_only_fetch == 'false' && '0' || '1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set ephemeral JSON paths
        run: |
          echo "VNINDEX_JSON=${RUNNER_TEMP}/vnindex.json" >> "$GITHUB_ENV"
          echo "STOCK_JSON=${RUNNER_TEMP}/stock-bars.json" >> "$GITHUB_ENV"
          echo "SYMBOLS_JSON=${RUNNER_TEMP}/effective-universe-symbol-keys.json" >> "$GITHUB_ENV"
          echo "STALE_SYMBOLS_JSON=${RUNNER_TEMP}/stale-fetch-targets.json" >> "$GITHUB_ENV"
          echo "STALE_TARGET_SUMMARY_JSON=${RUNNER_TEMP}/stale-fetch-target-summary.json" >> "$GITHUB_ENV"

      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL" || (echo "Missing secret DATABASE_URL" && exit 1)
          test -n "$CRON_SECRET" || (echo "Missing secret CRON_SECRET (scan trigger)" && exit 1)
          test -n "$DEPLOYMENT_URL" || (echo "Missing secret DEPLOYMENT_URL (e.g. https://tradingbook-phi.vercel.app)" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Assert production database target
        run: npx tsx scripts/assert-production-database.ts

      - name: Pre-import health snapshot
        run: npx tsx scripts/verify-bar-import-health.ts --json | tee pre-import-health.json

      - name: Fetch VNINDEX (ephemeral JSON)
        run: python scripts/fetch_vnindex.py --output "$VNINDEX_JSON"

      - name: Import VNINDEX into Postgres
        run: npx tsx scripts/import-bars.ts "$VNINDEX_JSON"

      - name: Export effective universe symbols (core + tactical, no smoke tickers)
        run: npx tsx scripts/export-active-symbol-keys.ts --out "$SYMBOLS_JSON"

      - name: List stale equity fetch targets (read-only DB)
        if: env.SKIP_EQUITY != '1' && env.STALE_ONLY_FETCH != '0'
        env:
          SMOKE_DATABASE: production
        run: |
          set -euo pipefail
          npx tsx scripts/list-stale-fetch-targets.ts \
            --production-read-only \
            --active-only \
            --write-symbols-file="$STALE_SYMBOLS_JSON" \
            --json | tee "$STALE_TARGET_SUMMARY_JSON"
          python3 -c "import json; d=json.load(open('$STALE_TARGET_SUMMARY_JSON')); print('stale_fetch_listing databaseUrlHint=', d.get('databaseUrlHint','(masked)')); print('fetchTargetCount=', d.get('fetchTargetCount')); print('universeSize=', d.get('universeSize'))"

      - name: Select equity symbol list for fetch
        if: env.SKIP_EQUITY != '1'
        run: |
          set -euo pipefail
          FULL_COUNT="$(python3 -c "import json; print(len(json.load(open('$SYMBOLS_JSON')).get('symbols',[])))")"
          USE_STALE=0
          if [ "${STALE_ONLY_FETCH:-1}" != "0" ] && [ -f "$STALE_TARGET_SUMMARY_JSON" ]; then
            STALE_COUNT="$(python3 -c "import json; print(json.load(open('$STALE_TARGET_SUMMARY_JSON')).get('fetchTargetCount',0))")"
            if [ "$STALE_COUNT" -gt 0 ] && [ "$STALE_COUNT" -lt "$FULL_COUNT" ]; then
              USE_STALE=1
            fi
          fi
          if [ "$USE_STALE" -eq 1 ]; then
            echo "FETCH_SYMBOLS_JSON=$STALE_SYMBOLS_JSON" >> "$GITHUB_ENV"
            echo "Equity fetch mode: stale-only ($STALE_COUNT of $FULL_COUNT symbols)"
          else
            echo "FETCH_SYMBOLS_JSON=$SYMBOLS_JSON" >> "$GITHUB_ENV"
            if [ "${STALE_ONLY_FETCH:-1}" = "0" ]; then
              echo "Equity fetch mode: full universe (STALE_ONLY_FETCH=0 rollback)"
            else
              echo "Equity fetch mode: full universe (stale-only skipped: count=$STALE_COUNT full=$FULL_COUNT)"
            fi
          fi

      - name: Resolve equity fetch end-date from VNINDEX session
        id: session
        run: echo "end_date=$(npx tsx scripts/print-expected-session-day.ts)" >> "$GITHUB_OUTPUT"

      - name: Fetch equity bars
        if: env.SKIP_EQUITY != '1'
        run: |
          python scripts/fetch_stock_bars.py \
            --symbols-file "$FETCH_SYMBOLS_JSON" \
            --output "$STOCK_JSON" \
            --sleep 3.2 \
            --calendar-days 200 \
            --end-date "${{ steps.session.outputs.end_date }}"

      - name: Import equity bars into Postgres
        if: env.SKIP_EQUITY != '1'
        run: npx tsx scripts/import-stock-bars.ts "$STOCK_JSON"

      - name: Post-import health snapshot
        run: npx tsx scripts/verify-bar-import-health.ts --json | tee post-import-health.json

      - name: Resolve session date for foreign capture
        id: foreign_session
        run: echo "session_date=$(npx tsx scripts/print-expected-session-day.ts)" >> "$GITHUB_OUTPUT"

      - name: Fetch foreign snapshots (VCI price_board)
        if: env.SKIP_EQUITY != '1'
        run: |
          python scripts/fetch_foreign_snapshot.py \
            --symbols-file "$SYMBOLS_JSON" \
            --session-date "${{ steps.foreign_session.outputs.session_date }}" \
            --output "$RUNNER_TEMP/foreign-snapshot.json" \
            --batch-size 10 \
            --sleep 3.2

      - name: Import foreign snapshots
        if: env.SKIP_EQUITY != '1'
        run: |
          npx tsx scripts/import-foreign-flow.ts "$RUNNER_TEMP/foreign-snapshot.json" \
            --expect-session "${{ steps.foreign_session.outputs.session_date }}"

      - name: Build market context
        if: env.SKIP_EQUITY != '1'
        run: |
          npx tsx scripts/build-market-context.ts \
            --session-date "${{ steps.foreign_session.outputs.session_date }}"

      - name: Verify market context health
        if: env.SKIP_EQUITY != '1'
        run: |
          npx tsx scripts/verify-market-context-health.ts \
            --session-date "${{ steps.foreign_session.outputs.session_date }}" \
            --json | tee market-context-health.json || true

      - name: Copy stale-target summary for artifacts
        if: env.SKIP_EQUITY != '1' && env.STALE_ONLY_FETCH != '0'
        run: |
          if [ -f "$STALE_TARGET_SUMMARY_JSON" ]; then
            cp "$STALE_TARGET_SUMMARY_JSON" stale-fetch-target-summary.json
          fi

      - name: Upload monitoring artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bar-import-health-${{ github.run_id }}
          path: |
            pre-import-health.json
            post-import-health.json
            stale-fetch-target-summary.json
            market-context-health.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Trigger production daily scan
        if: env.TRIGGER_SCAN == '1'
        run: |
          set -euo pipefail
          BASE="${DEPLOYMENT_URL%/}"
          RESP="$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/daily-scan")"
          BODY="$(echo "$RESP" | head -n -1)"
          CODE="$(echo "$RESP" | tail -n 1)"
          echo "$BODY" | tee scan-response.json
          if [ "$CODE" != "200" ]; then
            echo "daily-scan HTTP $CODE" >&2
            exit 1
          fi
          echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, d"

      - name: Upload scan response
        if: env.TRIGGER_SCAN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: scan-response-${{ github.run_id }}
          path: scan-response.json
          retention-days: 14
